# Daily: fetch live events + photos, commit the data, deploy to GitHub Pages,
# then screenshot the live site (download from the run's artifacts).
# Optional: TICKETMASTER_API_KEY secret (more listings); VITE_SPOTIFY_CLIENT_ID and VITE_BUTTONDOWN_USER variables. Enable Pages once: Settings → Pages → Source: GitHub Actions.
name: Refresh and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * *' # ~6 am New York
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch events and photos
        run: npm run ingest
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      - name: Build the weekly editions
        run: npm run edition
      - name: Commit refreshed data
        run: |
          git config user.name "worth-going-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data ingest/cache public/feed.xml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh events $(date -u +%Y-%m-%d)"
          # Someone may have pushed during the run: replay this data commit on top (its data wins).
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Build for Pages
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional Spotify connect (README → Spotify). A client ID is public, so it's a variable.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_BUTTONDOWN_USER: ${{ vars.VITE_BUTTONDOWN_USER }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  screenshots:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: node scripts/check-links.mjs
      - run: node scripts/screenshots.mjs "${{ needs.deploy.outputs.url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
      # Also keep the latest set on a `screenshots` branch so they can be viewed without artifact access.
      - name: Publish screenshots branch
        run: |
          git config user.name "worth-going-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan screenshots-tmp
          git rm -rfq --cached .
          git add -f screenshots
          git commit -qm "Screenshots $(date -u +%Y-%m-%dT%H:%M)"
          git push -f origin HEAD:screenshots
